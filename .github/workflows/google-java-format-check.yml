name: Java Format Check
on:
  push:
    branches:
      - '**'
jobs:
  spotless-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Spotless Check
        run: ./mvnw spotless:check
        working-directory: ./backend
