name: PR CI - Frontend React Build

on:
  pull_request:
    branches: [ "main" ]
    paths: ["frontend/**"]

permissions:
  contents: write

concurrency:
  group: pr-ci-frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Auto-format Code
        run: npm run format --if-present
        working-directory: ./frontend

      - name: Commit formatted code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format frontend code"

      - name: Lint code
        run: npm run lint
        working-directory: ./frontend

      - name: Run tests
        run: npm run test --if-present
        working-directory: ./frontend