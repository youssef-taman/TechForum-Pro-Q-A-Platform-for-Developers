name: PR CI - Spring Boot Build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Spring Boot requirement)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build + run tests
      - name: Build with Maven
        run: mvn clean verify
