name: PR CI - Spring Boot Build

on:
  pull_request:
    branches: [ "main" ]
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: pr-ci-backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: techforum_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Test with Maven Wrapper
        run: ./mvnw -B clean package
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/techforum_db
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

      - name: Generate OpenAPI Spec
        run: ./mvnw springdoc-openapi:generate
        working-directory: ./backend

      - name: Upload Swagger JSON
        uses: actions/upload-artifact@v4
        with:
          name: swagger-api-docs
          path: backend/target/openapi.json

      - name: Generate Database Documentation
        uses: rlespinasse/github-action-schemaspy@master
        with:
          database_type: pgsql
          database_host: localhost
          database_port: 5432
          database_name: techforum_db
          database_user: test_user
          database_password: test_password

      - name: Upload DB Docs
        uses: actions/upload-artifact@v4
        with:
          name: database-erd-docs
          path: output/

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}