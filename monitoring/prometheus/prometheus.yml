global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'techforum-monitor'

scrape_configs:
  - job_name: 'spring-boot-backend'
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']
        labels:
          app: 'backend'
          env: 'development'
    # Relabel to add application name
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  - job_name: 'prometheus-self'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']