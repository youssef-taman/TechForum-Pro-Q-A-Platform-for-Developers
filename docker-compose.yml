version: '3.8'

services:

  app:
    image: mcr.microsoft.com/devcontainers/java:21
    volumes:
      - ./backend:/workspaces/techforum-pro/backend:cached
    tty: true
    stdin_open: true
    depends_on:
      - db
      - redis
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}

  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build: ./frontend
    container_name: forum-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
      
volumes:
  postgres_data:
  redis_data: