services:

  app:
    image: mcr.microsoft.com/devcontainers/java:21
    container_name: Spring-Boot
    working_dir: /workspaces/techforum-pro/backend
    volumes:
      - ./backend:/workspaces/techforum-pro/backend:cached
      - maven_cache:/root/.m2
    tty: true
    stdin_open: true
    command: sh -c "./mvnw spring-boot:run"
    ports:
      - "8080:8080"
    networks:
      - techforum_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  db:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: PostgreSQL
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techforum_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - techforum_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: React-Vite
    working_dir: /workspaces/techforum-pro/frontend
    volumes:
      - ./frontend:/workspaces/techforum-pro/frontend:cached
      - npm_cache:/root/.npm
    ports:
      - "5173:5173"
    networks:
      - techforum_net
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      app:
        condition: service_healthy


  ai-service:
    image: python:3.12-slim
    container_name: AI-Service
    working_dir: /workspaces/techforum-pro/ai-service
    volumes:
      - ./ai-service:/workspaces/techforum-pro/ai-service:cached
      - pip_cache:/root/.cache/pip
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "50051:50051"
    networks:
      - techforum_net
    command: sh -c "pip install -r requirements.txt && python server.py"

networks:
  techforum_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  npm_cache:
  pip_cache: